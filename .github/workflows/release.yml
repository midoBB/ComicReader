name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux amd64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o comicreader-linux-amd64 .

      - name: Build Linux arm64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o comicreader-linux-arm64 .

      - name: Package release archives
        run: |
          TAG=${GITHUB_REF_NAME}

          for ARCH in amd64 arm64; do
            DIR="comicreader-${TAG}-linux-${ARCH}"
            mkdir "$DIR"
            cp "comicreader-linux-${ARCH}" "${DIR}/comicreader"
            cp contrib/config.yaml "${DIR}/config.yaml"
            cp contrib/comicreader.service "${DIR}/comicreader.service"
            tar -czf "${DIR}.tar.gz" "$DIR"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            comicreader-*-linux-amd64.tar.gz
            comicreader-*-linux-arm64.tar.gz
          generate_release_notes: true
